
name: Validate Documentation and Search

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Convert sample HTML to Markdown
        run: python scripts/convert_docs.py --input sample_source --output docs

      - name: Validate Markdown documentation
        run: python scripts/validate_docs.py

      - name: Test documentation search
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Check Python syntax
        run: python -m compileall -q scripts app.py
